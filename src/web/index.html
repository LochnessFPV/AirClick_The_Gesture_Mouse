<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AirClick</title>
    <script type="text/javascript" src="/eel.js"></script>
    <link rel="stylesheet" type="text/css" href="css/jquery.convform.css">
    <link rel="stylesheet" type="text/css" href="css/app.css">
</head>
<body>
    <header class="app-header">
        <img src="images/icon.png" width="24" height="24" alt="">
        <h1>AirClick</h1>
        <span class="status-pill">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Idle</span>
        </span>
    </header>

    <nav class="tabs" role="tablist">
        <button id="tabChatButton" role="tab" aria-selected="true" aria-controls="tabChat">Assistant</button>
        <button id="tabSettingsButton" role="tab" aria-selected="false" aria-controls="tabSettings">Settings</button>
    </nav>

    <section id="tabChat" class="tab-panel active" role="tabpanel">
        <div class="toolbar">
            <button id="startButton" type="button" class="primary">Start gesture control</button>
            <button id="stopButton" type="button" class="secondary" disabled>Stop</button>
        </div>
        <div id="statusLine" class="status-line">Gesture control is off.</div>
        <div class="chat-wrapper">
            <div class="conv-form-wrapper" style="height:auto;">
                <div id="messages"></div>
            </div>
            <div id="convForm" class="convFormDynamic" style="height:50px;margin-top:8px;">
                <input type="text" id="userInput" placeholder="Type Here" class="userInputDynamic"
                       style="margin: 7px 7.575px 7px 10px; width: 219px; height: 24px;">
                <button id="userInputButton" type="button" class="submit" style="margin-top:9px">&#9654;</button>
                <span class="clear"></span>
            </div>
        </div>
    </section>

    <section id="tabSettings" class="tab-panel" role="tabpanel">
        <div class="profiles">
            <select id="profileSelect" title="Active profile"></select>
            <input type="text" id="profileName" placeholder="New profile name">
            <button id="profileSave" type="button" class="secondary">Save</button>
            <button id="profileDelete" type="button" class="secondary">Delete</button>
        </div>
        <div class="toolbar">
            <button id="resetAll" type="button" class="secondary">Reset all to defaults</button>
            <button id="refreshCameras" type="button" class="secondary">Detect cameras</button>
        </div>
        <div id="settingsError" class="toast"></div>
        <div id="settingsBody" class="settings-body">Loading settings&hellip;</div>
    </section>

    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
